<!DOCTYPE html>

<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>BeninPay - Vérification OTP</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Sora:wght@600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb95f",
                        "inverse-primary": "#4cdf98",
                        "primary-fixed": "#6dfcb2",
                        "tertiary-fixed": "#ffddb8",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#bbcabe",
                        "on-tertiary-container": "#503100",
                        "on-tertiary-fixed": "#2a1700",
                        "inverse-surface": "#213145",
                        "on-background": "#0b1c30",
                        "surface-container-highest": "#d3e4fe",
                        "surface-container": "#e5eeff",
                        "surface": "#f8f9ff",
                        "on-error-container": "#93000a",
                        "surface-variant": "#d3e4fe",
                        "primary": "#006d43",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "on-surface": "#0b1c30",
                        "on-secondary-fixed-variant": "#3f465c",
                        "on-primary-fixed": "#002111",
                        "surface-dim": "#cbdbf5",
                        "surface-container-low": "#eff4ff",
                        "inverse-on-surface": "#eaf1ff",
                        "primary-container": "#00b875",
                        "secondary": "#565e74",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#4cdf98",
                        "tertiary": "#855300",
                        "secondary-fixed-dim": "#bec6e0",
                        "on-secondary-fixed": "#131b2e",
                        "background": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "tertiary-container": "#e08f00",
                        "on-surface-variant": "#3c4a40",
                        "secondary-container": "#dae2fd",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#dae2fd",
                        "on-primary-container": "#004126",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-primary-fixed-variant": "#005231",
                        "surface-tint": "#006d43",
                        "on-secondary-container": "#5c647a",
                        "outline": "#6c7b70",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "base": "4px",
                        "md": "16px",
                        "gutter": "16px",
                        "lg": "24px",
                        "xs": "8px",
                        "sm": "12px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "price-display": ["Sora"],
                        "headline-sm": ["Sora"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Sora"],
                        "headline-md": ["Sora"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "price-display": ["36px", { "lineHeight": "44px", "letterSpacing": "-1px", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }

        .otp-input:focus {
            box-shadow: 0 0 0 2px #00b875;
        }

        .otp-input.field-error {
            border-color: #ba1a1a;
        }

        #otp-error {
            display: none;
        }

        #otp-error.show {
            display: flex;
        }
    </style>
</head>

<body
    class="bg-surface text-on-surface min-h-screen font-body-md selection:bg-primary-container selection:text-on-primary-container">
    <div
        class="max-w-[428px] mx-auto min-h-screen bg-gradient-to-b from-surface-container-low to-surface flex flex-col relative shadow-[0_0_24px_rgba(15,23,42,0.08)]">
        <!-- Header -->
        <header
            class="w-full sticky top-0 z-40 shadow-sm bg-surface flex items-center justify-between px-container-margin h-16 transition-all">
            <button
                class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 text-primary"
                onclick="window.location.href='../inscription_kyc/code.html'" type="button">
                <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
            </button>
            <div class="font-headline-md text-headline-md text-primary font-bold">BeninPay</div>
            <div class="w-10"></div> <!-- Spacer for centering -->
        </header>
        <!-- Main Content Canvas -->
        <main class="flex-1 px-container-margin py-xl flex flex-col">
            <!-- Stepper Progress -->
            <div class="mb-lg">
                <div class="flex justify-between items-center mb-xs">
                    <span class="font-label-md text-label-md text-secondary">Étape 2 sur 3</span>
                    <span class="font-label-md text-label-md text-primary font-bold">Vérification</span>
                </div>
                <div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
                    <div class="h-full bg-primary-container rounded-full w-[66%] transition-all duration-500 ease-out">
                    </div>
                </div>
            </div>
            <!-- Titles -->
            <div class="mb-xl text-center">
                <h1 class="font-display-lg text-display-lg text-on-surface mb-sm">Vérifiez votre numéro</h1>
                <p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                    Saisissez le code à 6 chiffres envoyé par SMS au <br />
                    <strong class="text-on-surface" id="phone-display">+229 XX XX XX XX</strong>
                </p>
            </div>

            <!-- Message d'erreur -->
            <div class="items-center gap-xs bg-error-container text-error rounded-lg px-sm py-xs mb-md font-body-sm text-body-sm"
                id="otp-error">
                <span class="material-symbols-outlined" style="font-size: 18px;">error</span>
                <span>Veuillez saisir les 6 chiffres du code reçu par SMS.</span>
            </div>

            <!-- OTP Inputs -->
            <div class="flex justify-between gap-2 mb-xl">
                <input aria-label="Digit 1"
                    class="otp-input w-[48px] h-[56px] text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-transparent focus:outline-none focus:ring-0 transition-shadow transition-colors placeholder-secondary-fixed-dim"
                    inputmode="numeric" maxlength="1" placeholder="·" type="tel" />
                <input aria-label="Digit 2"
                    class="otp-input w-[48px] h-[56px] text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-transparent focus:outline-none focus:ring-0 transition-shadow transition-colors placeholder-secondary-fixed-dim"
                    inputmode="numeric" maxlength="1" placeholder="·" type="tel" />
                <input aria-label="Digit 3"
                    class="otp-input w-[48px] h-[56px] text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-transparent focus:outline-none focus:ring-0 transition-shadow transition-colors placeholder-secondary-fixed-dim"
                    inputmode="numeric" maxlength="1" placeholder="·" type="tel" />
                <input aria-label="Digit 4"
                    class="otp-input w-[48px] h-[56px] text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-transparent focus:outline-none focus:ring-0 transition-shadow transition-colors placeholder-secondary-fixed-dim"
                    inputmode="numeric" maxlength="1" placeholder="·" type="tel" />
                <input aria-label="Digit 5"
                    class="otp-input w-[48px] h-[56px] text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-transparent focus:outline-none focus:ring-0 transition-shadow transition-colors placeholder-secondary-fixed-dim"
                    inputmode="numeric" maxlength="1" placeholder="·" type="tel" />
                <input aria-label="Digit 6"
                    class="otp-input w-[48px] h-[56px] text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-transparent focus:outline-none focus:ring-0 transition-shadow transition-colors placeholder-secondary-fixed-dim"
                    inputmode="numeric" maxlength="1" placeholder="·" type="tel" />
            </div>
            <!-- Timer / Resend -->
            <div class="text-center mb-auto" id="timer-container">
                <p class="font-body-md text-body-md text-secondary" id="timer-text">
                    Renvoyer le code dans <span class="font-bold text-on-surface">00:30</span>
                </p>
                <button
                    class="hidden font-body-md text-body-md font-bold text-primary hover:text-primary-container active:opacity-80 transition-opacity"
                    id="resend-btn" type="button">
                    Renvoyer le code
                </button>
            </div>
            <!-- Action Button -->
            <div class="mt-xl pb-lg">
                <button
                    class="w-full h-[56px] bg-primary-container text-on-primary-container font-headline-sm text-headline-sm rounded-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-[0_4px_12px_rgba(0,184,117,0.15)]"
                    id="verify-btn" type="button">
                    Vérifier &amp; Continuer
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
                </button>
            </div>
        </main>
    </div>
    <script>
        // Simple OTP input navigation
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                e.target.classList.remove('field-error');
                document.getElementById('otp-error').classList.remove('show');
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Auto-focus first input
        setTimeout(() => {
            if (inputs.length > 0) inputs[0].focus();
        }, 300);

        // Affiche le vrai numéro saisi à l'étape précédente
        const savedPhone = localStorage.getItem('beninpay_phone');
        if (savedPhone) {
            const formatted = savedPhone.replace(/(\d{2})(?=\d)/g, '$1 ').trim();
            document.getElementById('phone-display').textContent = '+229 ' + formatted;
        }

        // Simple timer logic
        let timeLeft = 30;
        const timerText = document.getElementById('timer-text');
        const resendBtn = document.getElementById('resend-btn');

        const timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerText.classList.add('hidden');
                resendBtn.classList.remove('hidden');
            } else {
                const seconds = timeLeft.toString().padStart(2, '0');
                timerText.innerHTML = `Renvoyer le code dans <span class="font-bold text-on-surface">00:${seconds}</span>`;
            }
        }, 1000);

        // Validation et passage à l'étape 3 (Code PIN)
        document.getElementById('verify-btn').addEventListener('click', function () {
            const otpError = document.getElementById('otp-error');
            let code = '';
            let hasError = false;

            inputs.forEach(function (input) {
                if (!/^[0-9]$/.test(input.value)) {
                    input.classList.add('field-error');
                    hasError = true;
                } else {
                    code += input.value;
                }
            });

            if (hasError || code.length !== 6) {
                otpError.classList.add('show');
                return;
            }

            otpError.classList.remove('show');
            window.location.href = '../inscription_tape_3_code_pin/code.html';
        });
    </script>
</body>

</html>
