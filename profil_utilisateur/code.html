    }

      -webkit-tap-highlight-color: transparent;

<body class="bg-background text-on-background min-h-screen relative font-body-md">
  <!-- Top App Bar -->
  <header
    class="flex justify-between items-center px-container-margin py-md w-full bg-background docked top-0 sticky z-40">
    <h1 class="font-headline-md text-headline-md font-bold text-primary">Mon Profil</h1>
    <button
      class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full transition-all">
      <span class="material-symbols-outlined" data-icon="settings">settings</span>
    </button>
  </header>

  <!-- Main Content -->
  <main class="px-container-margin pt-sm safe-pb flex flex-col gap-lg max-w-[600px] mx-auto w-full md:px-xl">
    <!-- Profile Card -->
    <section
      class="bg-surface-container-lowest rounded-xl p-lg border border-surface-container shadow-sm flex items-center gap-md">
      <div class="w-16 h-16 rounded-full bg-surface-container-high overflow-hidden shrink-0">
        <img alt="User profile photo" class="w-full h-full object-cover"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQ83XZ-Cf5mRUp_bQg_pZpXHokBxAo4HvRg7INCu1xkwSUWjjH6R_kTyNE9sIj6uHf4f5_ueMaDXDab1GUpDQpO7XlnTK55_Nq2MFEjWQZREDyDLHwkj5XLAHJmnfVfmCsZ8ZZSr9neqm_gG60qr3Dn35nMfIHvmUPYTe3ewWjTCrv4LNWB_ic-Qzbxx2KZ9g3nNOIujj_0F7X4kx1hW4YZ4TkjmhUBwWcCqkCGUTE7fEoU_JOL8Vxgw" />
      </div>
      <div class="flex-1 min-w-0">
        <h2 class="font-headline-sm text-headline-sm text-on-surface truncate">User BeninPay</h2>
        <p class="font-body-sm text-body-sm text-on-surface-variant truncate">+229 97 00 00 00</p>
        <div
          class="mt-xs inline-flex items-center gap-xs bg-primary-container/20 text-primary px-sm py-xs rounded-full font-label-md text-label-md">
          <span class="material-symbols-outlined text-[16px]">verified</span>
          Compte Vérifié (KYC)
        </div>
      </div>
    </section>

    <!-- Account Options Section -->
    <section class="flex flex-col gap-sm">
      <h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Paramètres du compte</h3>
      <div
        class="bg-surface-container-lowest rounded-xl border border-surface-container divide-y divide-surface-container overflow-hidden">
        <a href="../inscription_kyc/code.html"
          class="flex items-center justify-between p-md hover:bg-surface-container-low transition-colors">
          <div class="flex items-center gap-md">
            <span class="material-symbols-outlined text-primary" data-icon="badge">badge</span>
            <span class="font-body-md text-on-surface">Vérification d'identité</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
        </a>
        <a href="#" class="flex items-center justify-between p-md hover:bg-surface-container-low transition-colors">
          <div class="flex items-center gap-md">
            <span class="material-symbols-outlined text-primary" data-icon="security">security</span>
            <span class="font-body-md text-on-surface">Sécurité & Code PIN</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
        </a>
        <a href="#" class="flex items-center justify-between p-md hover:bg-surface-container-low transition-colors">
          <div class="flex items-center gap-md">
            <span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
            <span class="font-body-md text-on-surface">Notifications</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
        </a>
      </div>
    </section>

    <!-- Logout Section -->
    <section class="mt-md">
      <button onclick="logout()"
        class="w-full flex items-center justify-center gap-sm p-md rounded-xl bg-error-container/30 text-error hover:bg-error-container/50 active:scale-98 transition-all font-body-md font-semibold">
        <span class="material-symbols-outlined text-error" data-icon="logout">logout</span>
        <span class="font-label-md text-label-md text-error">Se déconnecter</span>
      </button>
    </section>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav
    class="fixed bottom-0 w-full z-50 bg-white border-t border-slate-200 shadow-[0_-4px_12px_rgba(15,23,42,0.08)] h-[64px] flex justify-around items-center px-container-margin pb-safe">
    <a href="../tableau_de_bord/code.html"
      class="flex flex-col items-center justify-center text-slate-700 hover:text-emerald-600 transition-colors h-full px-2 w-[72px] rounded-lg">
      <span class="material-symbols-outlined" data-icon="home">home</span>
      <span class="font-label-md text-[10px] mt-1">Accueil</span>
    </a>
    <a href="../transfert_inter_r_seaux/code.html"
      class="flex flex-col items-center justify-center text-slate-700 hover:text-emerald-600 transition-colors h-full px-2 w-[72px] rounded-lg">
      <span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
      <span class="font-label-md text-[10px] mt-1">Transactions</span>
    </a>
    <a href="../pargne_tontine/code.html"
      class="flex flex-col items-center justify-center text-slate-700 hover:text-emerald-600 transition-colors h-full px-2 w-[72px] rounded-lg">
      <span class="material-symbols-outlined" data-icon="savings">savings</span>
      <span class="font-label-md text-[10px] mt-1">Épargne</span>
    </a>
    <button
      class="flex flex-col items-center justify-center text-primary-fixed font-bold hover:bg-on-primary-fixed-variant transition-colors scale-95 active:scale-90 transition-transform h-full px-2 w-[72px] rounded-lg">
      <span class="material-symbols-outlined" data-icon="person"
        style="font-variation-settings: 'FILL' 1;">person</span>
      <span class="font-label-md text-[10px] mt-1">Profil</span>
    </button>
  </nav>

  <!-- Logout Logic -->
  <script>
    function logout() {
      // Nettoyage des clés de session / authentification
      localStorage.removeItem('token');
      localStorage.removeItem('user');

      // Redirection vers la page de connexion
      window.location.href = '../accueil_beninpay/code.html';
    }
  </script>
</body>

</html>
