<body
        class="dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200 bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md">
        <!-- Main Container -->
        <main class="w-full max-w-[428px] px-container-margin py-xl flex flex-col flex-grow">
                <!-- Header -->
                <header class="flex flex-col items-center mt-xl mb-xl">
                        <div
                                class="w-[80px] h-[80px] bg-primary rounded-xl flex items-center justify-center mb-md shadow-md">
                                <span class="material-symbols-outlined text-on-primary"
                                        style="font-size: 48px; font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
                        </div>
                        <h1 class="font-display-lg text-display-lg text-on-background">Bon retour</h1>
                        <p class="font-body-md text-body-md text-secondary mt-xs">Connectez-vous à BeninPay</p>
                </header>

                <!-- Message d'erreur global -->
                <div id="form-error"
                        class="items-center gap-xs bg-error-container text-error rounded-lg px-sm py-xs mb-md font-body-sm text-body-sm">
                        <span class="material-symbols-outlined" style="font-size: 18px;">error</span>
                        <span id="form-error-text">Veuillez remplir tous les champs.</span>
                </div>

                <!-- Form -->
                <form id="login-form" class="flex flex-col flex-grow gap-lg w-full" novalidate="">
                        <!-- Phone Number Field -->
                        <div class="relative group">
                                <label class="absolute -top-[10px] left-sm bg-background px-xs font-label-md text-label-md text-secondary z-10 group-focus-within:text-primary transition-colors"

                                <div id="phone-wrapper"
                                        class="flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all h-[56px] px-sm relative overflow-hidden">

                                                        class="font-body-md text-body-md text-on-background font-medium">+229</span>
                                        </div>
                                        <input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-background placeholder-secondary-fixed-dim"
                                                id="phone" placeholder="00 00 00 00" required="" type="tel" />
                                </div>
                        </div>
                        <!-- PIN Code Field -->
                        <div class="relative group">
                                <label class="absolute -top-[10px] left-sm bg-background px-xs font-label-md text-label-md text-secondary z-10 group-focus-within:text-primary transition-colors"

                                <div id="pin-wrapper"
                                        class="flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all h-[56px] px-sm">

                                                required="" type="password" />
                                        <button class="p-xs text-secondary hover:text-on-background transition-colors flex items-center justify-center"

                                                <span class="material-symbols-outlined"

                                        </button>
                                </div>
                        </div>

                                Pas encore de compte ? <span class="font-medium text-primary">S'inscrire</span>
                        </a>
                </footer>

        <script>
                function applyTheme() {
                        const isDark = localStorage.getItem('theme') === 'dark';
                        const html = document.documentElement;
                        const body = document.body;
                        const icon = document.getElementById('themeToggleIcon');

                        if (isDark) {
                                html.classList.add('dark');
                                body.style.backgroundColor = '#0f172a';
                                body.style.color = '#f8fafc';
                                if (icon) icon.textContent = 'light_mode';
                        } else {
                                html.classList.remove('dark');
                                body.style.backgroundColor = '#f8fafc';
                                body.style.color = '#0f172a';
                                if (icon) icon.textContent = 'dark_mode';
                        }
                }

                function toggleTheme() {
                        const isDark = localStorage.getItem('theme') === 'dark';
                        localStorage.setItem('theme', isDark ? 'light' : 'dark');
                        applyTheme();
                }

                document.addEventListener('DOMContentLoaded', applyTheme);
                applyTheme();

                // Afficher / masquer le code PIN
                function togglePinVisibility() {
                        const pin = document.getElementById('pin');
                        const icon = document.getElementById('pin-toggle-icon');
                        if (pin.type === 'password') {
                                pin.type = 'text';
                                icon.textContent = 'visibility';
                        } else {
                                pin.type = 'password';
                                icon.textContent = 'visibility_off';
                        }
                }

                // Validation du formulaire de connexion
                function showFormError(message) {
                        const errorBox = document.getElementById('form-error');
                        const errorText = document.getElementById('form-error-text');
                        errorText.textContent = message;
                        errorBox.classList.add('show');
                }

                function hideFormError() {
                        document.getElementById('form-error').classList.remove('show');
                }

                function clearFieldError(el) {
                        el.classList.remove('field-error');
                }

                const form = document.getElementById('login-form');
                const phoneInput = document.getElementById('phone');
                const pinInput = document.getElementById('pin');
                const phoneWrapper = document.getElementById('phone-wrapper');
                const pinWrapper = document.getElementById('pin-wrapper');

                phoneInput.addEventListener('input', function () {
                        clearFieldError(phoneWrapper);
                        hideFormError();
                });
                pinInput.addEventListener('input', function () {
                        clearFieldError(pinWrapper);
                        hideFormError();
                });

                form.addEventListener('submit', function (event) {
                        event.preventDefault();
                        hideFormError();
                        clearFieldError(phoneWrapper);
                        clearFieldError(pinWrapper);

                        const phoneValue = phoneInput.value.replace(/\s/g, '');
                        const pinValue = pinInput.value.trim();

                        let hasError = false;

                        if (phoneValue.length < 8) {
                                phoneWrapper.classList.add('field-error');
                                hasError = true;
                        }

                        if (pinValue.length < 4) {
                                pinWrapper.classList.add('field-error');
                                hasError = true;
                        }

                        if (hasError) {
                                showFormError('Veuillez saisir un numéro de téléphone et un code PIN valides.');
                                return;
                        }

                        // Données valides : accès au tableau de bord
                        window.location.href = '../tableau_de_bord/code.html';
                });
        </script>
