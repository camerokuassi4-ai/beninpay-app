<script>
  // Charger le solde en direct sur le Tableau de Bord
  async function syncDashboard() {
    try {
      const res = await fetch('http://localhost:3000/api/dashboard');
      const result = await res.json();
      if (result.status === 'success') {
        const soldeEl = document.querySelector('.font-bold, .text-3xl');
        if (soldeEl && soldeEl.innerText.includes('FCFA')) {
          soldeEl.innerText = `${result.data.solde.toLocaleString('fr-FR')} FCFA`;
        }
      }
    } catch(e) { console.debug('API non connectée'); }
  }

  document.addEventListener('DOMContentLoaded', syncDashboard);
</script>
