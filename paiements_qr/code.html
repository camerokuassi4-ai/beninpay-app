<style>
        body {
            background-color: #f8f9ff;
            color: #0b1c30;
            -webkit-tap-highlight-color: transparent;
        }
        /* Mobile-first constraints */
        .app-container {
            max-width: 428px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #f8f9ff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(15, 23, 42, 0.05);
        }
        
        /* Viewfinder framing */
        .viewfinder-frame {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }
        .viewfinder-frame::before, .viewfinder-frame::after,
        .viewfinder-corner-bl, .viewfinder-corner-br {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #00b875;
            border-style: solid;
            border-width: 0;
            border-radius: 8px;
        }
        .viewfinder-frame::before {
            top: 0; left: 0;
            border-top-width: 4px; border-left-width: 4px;
        }
        .viewfinder-frame::after {
            top: 0; right: 0;
            border-top-width: 4px; border-right-width: 4px;
        }
        .viewfinder-corner-bl {
            bottom: 0; left: 0;
            border-bottom-width: 4px; border-left-width: 4px;
        }
        .viewfinder-corner-br {
            bottom: 0; right: 0;
            border-bottom-width: 4px; border-right-width: 4px;
        }
        
        /* Scanning line animation */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00b875;
            box-shadow: 0 0 10px #00b875;
            animation: scan 2.5s infinite linear;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Ambient background for camera area */
        .camera-ambient {
            background: linear-gradient(135deg, rgba(0, 109, 67, 0.05) 0%, rgba(0, 33, 17, 0.1) 100%);
        }
    </style>

<script>
  function applyTheme() {
    const isDark = localStorage.getItem('theme') === 'dark';
    const html = document.documentElement;
    const body = document.body;
    const icon = document.getElementById('themeToggleIcon');

    if (isDark) {
      html.classList.add('dark');
      body.style.backgroundColor = '#0f172a';
      body.style.color = '#f8fafc';
      if (icon) icon.textContent = 'light_mode';
    } else {
      html.classList.remove('dark');
      body.style.backgroundColor = '#f8fafc';
      body.style.color = '#0f172a';
      if (icon) icon.textContent = 'dark_mode';
    }
  }

  function toggleTheme() {
    const isDark = localStorage.getItem('theme') === 'dark';
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
    applyTheme();
  }

  document.addEventListener('DOMContentLoaded', applyTheme);
  applyTheme();
</script>
